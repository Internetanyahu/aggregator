name: Refresh public property discovery leads
on:
  push:
    branches: [main]
    paths:
      - "aggregator/seller_discovery.py"
      - ".github/workflows/seller-discovery.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: seller-discovery
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Aggregate public property opportunities
        run: python -m aggregator.seller_discovery
      - name: Publish updated discovery index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/seller_leads.json
          if git diff --cached --quiet; then
            echo "No discovery index changes."
          else
            git commit -m "Refresh public seller discovery index"
            git push
          fi
